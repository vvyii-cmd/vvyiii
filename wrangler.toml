# Cloudflare Worker config for the company Data Console Applications platform.
# Assets-only Worker: serves the static export from `next build` (the `out/` dir).
# The Worker name must be "internal-<slug>", matching the Data Console slug.
name = "internal-otter-verify"
compatibility_date = "2026-10-07"

[assets]
directory = "./out"
not_found_handling = "404-page"
